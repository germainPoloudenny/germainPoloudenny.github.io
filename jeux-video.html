<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/svg+xml" href="img/favicon-gp.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="background-accent" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand brand-link" href="index.html">Germain Poloudenny</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Ouvrir le menu">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>
    <nav class="nav" id="site-nav">
      <a href="index.html#intro">Intro</a>
      <a href="index.html#skills">Compétences complémentaires</a>
      <a href="index.html#diplomas">Diplômes</a>
      <a href="index.html#experiences">Expériences</a>
      <a href="index.html#articles">Articles</a>
      <a href="index.html#projects">Projets</a>
      <a href="index.html#hobbies">Hobbies</a>
      <a class="active" href="jeux-video.html" aria-current="page">Jeux vidéo</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero writing-hero">
      <div class="hero-text">
        <h1>Jeux vidéo</h1>
      </div>
    </section>

    <section class="panel games-panel">
      <div class="game-list">
        <article class="card game-account-card">
          <img class="game-logo" src="img/league-of-legends.png" alt="League of Legends">
          <div class="game-content">
            <div class="game-account-row">
              <span class="game-id">Ayzikin <span class="game-tag">#EUW</span></span>
              <button class="chip-copy" type="button" data-copy="Ayzikin#EUW" aria-label="Copier l'identifiant League of Legends">
                <svg class="contact-icon stroke" viewBox="0 0 24 24" aria-hidden="true" focusable="false" stroke-width="1.6">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 8.25H5.25A2.25 2.25 0 003 10.5v8.25A2.25 2.25 0 005.25 21h8.25a2.25 2.25 0 002.25-2.25V15M9 8.25V5.25A2.25 2.25 0 0111.25 3h6a2.25 2.25 0 012.25 2.25v6A2.25 2.25 0 0117.25 13H14M9 8.25A2.25 2.25 0 0011.25 10.5H14" />
                </svg>
              </button>
            </div>
            <a class="game-profile-link" href="https://op.gg/lol/summoners/euw/Ayzikin-EUW" target="_blank" rel="noreferrer noopener" aria-label="Voir le profil OP.GG">
              <img class="opgg-logo" src="img/opgg.png" alt="OP.GG">
            </a>
          </div>
        </article>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.body.classList.add('js');

      const nav = document.querySelector('.nav');
      const navToggle = document.querySelector('.nav-toggle');

      if (nav && navToggle) {
        navToggle.addEventListener('click', () => {
          const isOpen = nav.classList.toggle('is-open');
          navToggle.setAttribute('aria-expanded', String(isOpen));
        });
      }

      const revealTargets = document.querySelectorAll('.hero, .panel, .card');
      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            }
          });
        },
        { threshold: 0.18, rootMargin: '0px 0px -10% 0px' }
      );

      revealTargets.forEach((el, index) => {
        el.classList.add('reveal');
        el.style.setProperty('--reveal-delay', `${Math.min(index * 18, 120)}ms`);
        observer.observe(el);
      });

      const copyToClipboard = async (value) => {
        if (window.navigator?.clipboard && window.isSecureContext) {
          await window.navigator.clipboard.writeText(value);
          return true;
        }

        if (typeof document.execCommand !== 'function') {
          return false;
        }

        const textarea = document.createElement('textarea');
        textarea.value = value;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();

        try {
          return document.execCommand('copy');
        } finally {
          textarea.remove();
        }
      };

      const copyButtons = document.querySelectorAll('[data-copy]');
      copyButtons.forEach((button) => {
        button.addEventListener('click', async () => {
          const value = button.getAttribute('data-copy');
          if (!value) return;

          let copied = false;
          try {
            copied = await copyToClipboard(value);
          } catch (error) {
            copied = false;
          }

          button.classList.add('is-copied');
          setTimeout(() => {
            button.classList.remove('is-copied');
          }, 1600);

          if (!copied) {
            window.prompt('Copier le texte :', value);
          }
        });
      });
    });
  </script>
</body>
</html>
