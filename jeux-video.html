<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Jeux vidéo - Germain Poloudenny</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon-gp.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="background-accent" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand brand-link" href="index.html">Germain Poloudenny</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Ouvrir le menu">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>
    <nav class="nav" id="site-nav">
      <a href="index.html#intro">Intro</a>
      <a href="index.html#skills">Compétences complémentaires</a>
      <a href="index.html#diplomas">Diplômes</a>
      <a href="index.html#experiences">Expériences</a>
      <a href="index.html#articles">Articles</a>
      <a href="index.html#projects">Projets</a>
      <a href="index.html#hobbies">Hobbies</a>
      <a class="active" href="jeux-video.html" aria-current="page">Jeux vidéo</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero writing-hero">
      <div class="hero-text">
        <h1>Jeux vidéo</h1>
        <p>Liste de mes projets vidéoludiques.</p>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Mes jeux</h2>
      </div>
      <div class="grid projects-grid">
        <figure class="card media">
          <h3>Witch</h3>
          <div class="tag-row">
            <span class="tag">Depuis 2025</span>
            <span class="tag">Jeu de rôle virtuel</span>
          </div>
          <img class="media-frame media-cover" src="img/witch.png" alt="Capture du jeu Witch">
        </figure>
        <figure class="card media">
          <h3>Ecosim</h3>
          <div class="tag-row">
            <span class="tag">2023</span>
            <span class="tag">Gestion</span>
            <span class="tag">Simulation</span>
          </div>
          <video class="media-frame" src="videos/ecosim.mp4" controls preload="metadata" aria-label="Vidéo du jeu Ecosim"></video>
        </figure>
        <figure class="card media">
          <h3>Error 404 Fire Fox Not Found</h3>
          <div class="tag-row">
            <span class="tag">2022</span>
            <span class="tag">Narratif</span>
          </div>
          <video class="media-frame" src="videos/Error404FireFoxNotFound.mp4" controls preload="metadata" aria-label="Vidéo du jeu Error 404 Fire Fox Not Found"></video>
        </figure>
        <figure class="card media">
          <h3>Kill The Demons</h3>
          <div class="tag-row">
            <span class="tag">2021</span>
            <span class="tag">RPG</span>
          </div>
          <video class="media-frame" src="videos/KillTheDemons.mp4" controls preload="metadata" aria-label="Vidéo du jeu Kill The Demons"></video>
        </figure>
        <figure class="card media">
          <h3>Flatcraft</h3>
          <div class="tag-row">
            <span class="tag">2020</span>
            <span class="tag">Sandbox</span>
            <span class="tag">Procédural</span>
          </div>
          <img class="media-frame media-cover" src="img/flatcraft.png" alt="Capture du jeu Flatcraft">
        </figure>
        <figure class="card media">
          <h3>Turn The Clock</h3>
          <div class="tag-row">
            <span class="tag">2019</span>
            <span class="tag">Platformer</span>
          </div>
          <button class="media-frame youtube-poster" type="button" data-youtube-id="SG7PVgzbT2U" data-youtube-title="Vidéo du jeu Turn The Clock" aria-label="Lire la vidéo Turn The Clock">
            <img class="youtube-poster-image" src="https://img.youtube.com/vi/SG7PVgzbT2U/maxresdefault.jpg" alt="">
            <span class="youtube-poster-play" aria-hidden="true">
              <img src="img/youtube.png" alt="">
            </span>
          </button>
        </figure>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.body.classList.add('js');

      const nav = document.querySelector('.nav');
      const navToggle = document.querySelector('.nav-toggle');

      if (nav && navToggle) {
        navToggle.addEventListener('click', () => {
          const isOpen = nav.classList.toggle('is-open');
          navToggle.setAttribute('aria-expanded', String(isOpen));
        });
      }

      const revealTargets = document.querySelectorAll('.hero, .panel, .panel-header, .card');
      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            }
          });
        },
        { threshold: 0.18, rootMargin: '0px 0px -10% 0px' }
      );

      revealTargets.forEach((el, index) => {
        el.classList.add('reveal');
        el.style.setProperty('--reveal-delay', `${Math.min(index * 18, 120)}ms`);
        observer.observe(el);
      });

      const youtubePosters = document.querySelectorAll('.youtube-poster');
      youtubePosters.forEach((poster) => {
        poster.addEventListener('click', () => {
          const videoId = poster.getAttribute('data-youtube-id');
          const title = poster.getAttribute('data-youtube-title') || 'Lecteur vidéo YouTube';
          if (!videoId) return;

          const iframe = document.createElement('iframe');
          iframe.className = 'media-frame';
          iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?rel=0&autoplay=1`;
          iframe.title = title;
          iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen';
          iframe.referrerPolicy = 'strict-origin-when-cross-origin';
          iframe.allowFullscreen = true;

          poster.replaceWith(iframe);
        });
      });
    });
  </script>
</body>
</html>
