<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Écrits - Germain Poloudenny</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon-gp.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="background-accent" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand brand-link" href="index.html">Germain Poloudenny</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Ouvrir le menu">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>
    <nav class="nav" id="site-nav">
      <a href="index.html#intro">Intro</a>
      <a href="index.html#skills">Compétences complémentaires</a>
      <a href="index.html#diplomas">Diplômes</a>
      <a href="index.html#experiences">Expériences</a>
      <a href="index.html#articles">Articles</a>
      <a href="index.html#projects">Projets</a>
      <a href="index.html#hobbies">Hobbies</a>
      <a class="active" href="ecrits.html" aria-current="page">Écrits</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="panel writings-panel">
      <div class="panel-header">
        <h2>Mes écrits</h2>
      </div>
      <div class="writings-list" id="writings-list" aria-label="Liste des écrits">
        <p class="empty-state">Aucun écrit pour le moment.</p>
      </div>
    </section>

  </main>

  <script src="data/les-esclaves-astre-noir.js?v=7114c84ff97d98cf7f44a380"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.body.classList.add('js');

      const nav = document.querySelector('.nav');
      const navToggle = document.querySelector('.nav-toggle');
      const writingData = window.portfolioWritingData || {};
      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      })[character]);
      const writings = [
        {
          cover: `img/les-esclaves-astre-noir.png?v=${writingData.assetVersion || '1'}`,
          title: "Les Esclaves - Tome 1 : L'Astre Noir",
          genre: 'Fantasy sombre',
          pdf: 'pdf/les-esclaves-t1-astre-noir.pdf',
          backCover: writingData.backCover || ''
        },
        {
          cover: 'img/revillage-tome1.png?v=6f7271ac0bb6',
          title: 'Re:Village - Tome 1'
        }
      ];
      const writingsList = document.querySelector('#writings-list');

      if (nav && navToggle) {
        navToggle.addEventListener('click', () => {
          const isOpen = nav.classList.toggle('is-open');
          navToggle.setAttribute('aria-expanded', String(isOpen));
        });
      }

      if (writingsList && writings.length > 0) {
        writingsList.classList.add('has-items');
        writingsList.innerHTML = writings.map((writing) => {
          const cover = `<img class="writing-cover" src="${writing.cover}" alt="Page de couverture de ${writing.title}">`;
          const coverBlock = writing.pdf
            ? `<a class="writing-cover-link" href="${writing.pdf}" target="_blank" rel="noreferrer noopener" aria-label="Lire ${writing.title}">${cover}</a>`
            : `<div class="writing-cover-link">${cover}</div>`;
          const meta = writing.genre
            ? `<div class="meta"><span class="pill">${writing.genre}</span></div>`
            : '';
          const actions = writing.pdf
            ? `<div class="writing-actions">
                <a class="paper-link writing-action pdf-action" href="${writing.pdf}" target="_blank" rel="noreferrer noopener" aria-label="Ouvrir le PDF de ${writing.title}">
                  <img class="pdf-action-logo" src="img/pdf-document.png" alt="" aria-hidden="true">
                </a>
              </div>`
            : '';
          const backCover = writing.backCover
            ? `<p>${escapeHtml(writing.backCover)}</p>`
            : '';

          const isPreviewOnly = !writing.pdf && !writing.genre && !writing.backCover;

          return `
            <article class="card writing-card${isPreviewOnly ? ' writing-card-preview' : ''}">
              ${coverBlock}
              <div class="writing-content">
                ${meta}
                <h3>${writing.title}</h3>
                ${actions}
                ${backCover}
              </div>
            </article>
          `;
        }).join('');
      }

      const revealTargets = document.querySelectorAll('.hero, .panel, .panel-header');
      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            }
          });
        },
        { threshold: 0.18, rootMargin: '0px 0px -10% 0px' }
      );

      revealTargets.forEach((el, index) => {
        el.classList.add('reveal');
        el.style.setProperty('--reveal-delay', `${Math.min(index * 18, 120)}ms`);
        observer.observe(el);
      });
    });
  </script>
</body>
</html>
